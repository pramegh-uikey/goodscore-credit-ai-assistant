<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
</head>

<body>
<h1>Financial Dashboard</h1>

<div class="section">
  <div class="header">
    <h2>Credit Score</h2>
    <button class="audio-btn" type="button" data-explain="dashboard.credit_score" disabled>Explain</button>
  </div>
  <div style="display: flex; align-items: center; gap: 20px;">
    <div>
      <p style="font-size: 36px; font-weight: bold; margin: 0;" id="score"></p>
      <p style="margin: 5px 0; color: #666;" id="score-change"></p>
    </div>
  </div>
  <p style="font-size: 12px; color: #999; margin-top: 10px;" id="last-refreshed"></p>
  <a class="link" href="credit.html">View details →</a>
</div>

<div class="section">
  <div class="header">
    <h2>Top Transactions</h2>
    <button class="audio-btn" type="button" data-explain="dashboard.top_transactions" disabled>Explain</button>
  </div>
  <table id="txnTable"></table>
  <a class="link" href="transactions.html">View 6 months →</a>
</div>

<div class="section">
  <div class="header">
    <h2>Top Active Loans</h2>
    <button class="audio-btn" type="button" data-explain="dashboard.active_loans" disabled>Explain</button>
  </div>
  <div id="loanCards"></div>
  <a class="link" href="loans.html">View all loans →</a>
</div>

<script src="section-explain.js"></script>
<script src="dashboard.js"></script>


</body>
</html>
